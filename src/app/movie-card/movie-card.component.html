<mat-card class="mdc-card">
  <img
    *ngIf="movie?.poster"
    [src]="movie.poster"
    [alt]="movie.title"
    class="movie-poster"
  >
  <div *ngIf="!movie?.poster" class="movie-poster placeholder">
    No Image Available
  </div>

  <mat-card-content class="mdc-card__content">
    <h2 class="movie-title">{{ movie.title }}</h2>
    <div class="movie-genre">{{ movie.genre }}</div>
    <div class="movie-director">
      <strong>Director:</strong> {{ movie.director }}
    </div>
    <div class="movie-rating">
      <strong>Rating:</strong> {{ movie.rating | number:'1.1-1' }}/10
    </div>
  </mat-card-content>

  <div class="card-actions">
    <button 
      mat-button 
      class="synopsis-button"
      (click)="openSynopsisDialog(movie)"
    >
      Synopsis
    </button>
    <button 
      mat-icon-button 
      class="favorite-button"
      [class.favorite]="isFavorite(movie.id)"
      (click)="toggleFavorite(movie.id)"
    >
      <mat-icon>{{ isFavorite(movie.id) ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
  </div>
</mat-card>
