<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title class="login-title">Log in to Sci-Flix!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form (ngSubmit)="loginUser()">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Username</mat-label>
        <input
          matInput
          [(ngModel)]="userData.username"
          type="text"
          name="username"
          required
        >
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Password</mat-label>
        <input
          matInput
          [(ngModel)]="userData.password"
          type="password"
          name="password"
          required
        >
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
      <div class="login-action-buttons">
        <button
          mat-raised-button
          type="submit"
        >
          Login
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
