<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title class="login-title">Log in to Sci-Flix!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <style>
      /* Override input backgrounds directly in the component */
      .dark-input .mat-mdc-text-field-wrapper {
        background-color: rgba(30, 41, 59, 0.8) !important;
      }
      .dark-input input {
        background-color: rgba(30, 41, 59, 0.8) !important;
      }
    </style>
    <form (ngSubmit)="loginUser()" #loginForm="ngForm">
      <mat-form-field appearance="outline" class="form-field dark-input">
        <mat-label>Username</mat-label>
        <input
          matInput
          [(ngModel)]="userData.username"
          type="text"
          name="username"
          required
          #username="ngModel"
          style="background-color: rgba(30, 41, 59, 0.8) !important;"
        >
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="form-field dark-input">
        <mat-label>Password</mat-label>
        <input
          matInput
          [(ngModel)]="userData.password"
          [type]="hidePassword ? 'password' : 'text'"
          name="password"
          required
          #password="ngModel"
          style="background-color: rgba(30, 41, 59, 0.8) !important;"
        >
        <button 
          mat-icon-button 
          matSuffix 
          type="button"
          (click)="hidePassword = !hidePassword" 
          [attr.aria-label]="'Toggle password visibility'"
        >
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
      <div class="login-action-buttons">
        <button
          mat-raised-button
          type="submit"
          [disabled]="loginForm.invalid"
        >
          <span *ngIf="!isLoading">Login</span>
          <mat-spinner *ngIf="isLoading" diameter="24" class="spinner"></mat-spinner>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
