<div class="profile-container">
  <!-- User Profile Card -->
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>Profile</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="!editMode">
        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <button mat-raised-button color="primary" (click)="toggleEditMode()">Edit Profile</button>
        <button mat-raised-button color="warn" (click)="deleteAccount()">Delete Account</button>
      </div>

      <form *ngIf="editMode" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="updatedUser.username" name="username" required>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="updatedUser.email" name="email" required type="email">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>New Password</mat-label>
          <input matInput [(ngModel)]="newPassword" name="password" type="password">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Confirm New Password</mat-label>
          <input matInput [(ngModel)]="confirmPassword" name="confirmPassword" type="password">
        </mat-form-field>

        <div class="button-container">
          <button mat-raised-button type="submit" color="primary">Save Changes</button>
          <button mat-raised-button type="button" (click)="toggleEditMode()">Cancel</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Favorite Movies Section -->
  <section class="favorites-section">
    <h2>Favorite Movies</h2>
    <div class="movie-grid">
      <app-movie-card 
        *ngFor="let movie of favoriteMovies" 
        [movie]="movie"
        (movieRemoved)="handleMovieRemoved($event)"
      ></app-movie-card>
    </div>
  </section>
</div>
