<div class="signup-container">
  <h2 class="signup-title">Sign Up!</h2>
  
  <form (ngSubmit)="registerUser()" #registrationForm="ngForm">
    <div class="form-field-container">
      <mat-form-field appearance="outline" class="form-field dark-input">
        <mat-label>Username</mat-label>
        <input
          matInput
          [(ngModel)]="userData.username"
          type="text"
          name="username"
          required
          #username="ngModel"
          minlength="3"
          style="background-color: rgba(30, 41, 59, 0.8) !important;"
        >
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
    </div>
    
    <div class="form-field-container">
      <mat-form-field appearance="outline" class="form-field dark-input">
        <mat-label>Password</mat-label>
        <input
          matInput
          [(ngModel)]="userData.password"
          [type]="hidePassword ? 'password' : 'text'"
          name="password"
          required
          #password="ngModel"
          minlength="8"
          style="background-color: rgba(30, 41, 59, 0.8) !important;"
        >
        <button 
          mat-icon-button 
          matSuffix 
          type="button"
          (click)="hidePassword = !hidePassword" 
          [attr.aria-label]="'Toggle password visibility'"
        >
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
    </div>
    
    <div class="form-field-container">
      <mat-form-field appearance="outline" class="form-field dark-input">
        <mat-label>Email</mat-label>
        <input
          matInput
          [(ngModel)]="userData.email"
          type="email"
          name="email"
          required
          #email="ngModel"
          email
          style="background-color: rgba(30, 41, 59, 0.8) !important;"
        >
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>
    </div>
    
    <div class="form-field-container date-field-container">
      <mat-form-field appearance="outline" class="form-field birthdate-field dark-input">
        <mat-label>Birthday</mat-label>
        <input
          matInput
          [(ngModel)]="userData.birthday"
          type="date"
          name="birthday"
          #birthday="ngModel"
          max="{{maxDate | date:'yyyy-MM-dd'}}"
          style="background-color: rgba(30, 41, 59, 0.8) !important; min-width: 100% !important;"
        >
        <mat-icon matSuffix>event</mat-icon>
      </mat-form-field>
    </div>
    
    <div class="signup-action-buttons">
      <button
        mat-raised-button
        type="submit"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Sign Up</span>
        <mat-spinner *ngIf="isLoading" diameter="24" class="spinner"></mat-spinner>
      </button>
    </div>
  </form>
</div>
